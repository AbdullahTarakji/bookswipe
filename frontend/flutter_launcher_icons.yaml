flutter_launcher_icons:
  # Android configuration
  android: true
  ios: true

  # Path to the icon image (create this asset)
  image_path: "assets/icon/app_icon.png"

  # Android-specific
  adaptive_icon_background: "#4A00E0"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

  # iOS-specific — no transparency, no alpha
  remove_alpha_ios: true

  # Web favicon
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#4A00E0"
    theme_color: "#4A00E0"

  # macOS
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
