apiVersion: v1
kind: ConfigMap
metadata:
  name: bookswipe-config
  labels:
    app: bookswipe-api
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  APP_VERSION: "1.0.0"
  PROMETHEUS_ENABLED: "true"
  AUTH_RATE_LIMIT: "5/minute"
  API_RATE_LIMIT: "30/minute"
  RATE_LIMIT_REQUESTS: "60"
  RATE_LIMIT_WINDOW: "60"
  CORS_ORIGINS: '["https://bookswipe.io"]'
