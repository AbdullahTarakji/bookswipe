apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookswipe-api
  labels:
    app: bookswipe-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookswipe-api
  template:
    metadata:
      labels:
        app: bookswipe-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: bookswipe-api
          image: bookswipe/api:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: bookswipe-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bookswipe-secrets
                  key: secret-key
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: bookswipe-secrets
                  key: sentry-dsn
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bookswipe-secrets
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
