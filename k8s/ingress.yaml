apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookswipe-api
  labels:
    app: bookswipe-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "30"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.bookswipe.io
      secretName: bookswipe-tls
  rules:
    - host: api.bookswipe.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookswipe-api
                port:
                  number: 80
